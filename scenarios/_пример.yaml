# ПРИМЕР СЦЕНАРИЯ. Файлы, имя которых начинается с «_», сборщик пропускает.
# Чтобы добавить сайт: скопируй этот файл, назови, например, 012-chery-avto.yaml и заполни.
#
# Как это читать: сборщик открывает каждую страницу из списка pages,
# находит на ней все карточки моделей (card) и в каждой карточке берёт
# название (model), цену (price) и выгоду (benefit).
# Адреса в card/model/price/benefit — это CSS-селекторы: «как найти этот кусок страницы».
# Если не знаешь их, оставь только url: сборщик сделает снимок страницы,
# а селекторы потом подберём по снимку.

id: 12                       # номер сайта, как в старой таблице «Сайты»
company: ООО «Пример Авто»   # компания-дилер
site: example-dealer.ru      # адрес сайта без https://
brand: Chery                 # марка
active: true                 # false — сайт временно не проверяем
responsible: Иван Петров     # кто отвечает за этот сайт (видно на главной)

pages:
  - url: https://example-dealer.ru/models   # страница с моделями и ценами
    card: .model-card                        # блок одной модели
    model: .model-card__title                # название модели внутри блока
    price: .model-card__price                # цена «от» внутри блока
    benefit: .model-card__benefit            # выгода «до» внутри блока (можно не писать)
    # Необязательные шаги перед сбором:
    # click: [".cookie-accept"]   # нажать кнопки (например, закрыть окно про куки)
    # wait_for: .model-card       # подождать, пока появятся карточки
    # scroll: true                # прокрутить страницу вниз, чтобы всё подгрузилось

  - url: https://example-dealer.ru/special-offers   # страниц может быть несколько
    card: .offer
    model: .offer__name
    benefit: .offer__benefit

# ОБХОД ПО МОДЕЛЯМ (лучший способ: смотрит все комплектации каждой модели).
# Сборщик открывает list_url, находит ссылки на все модели (link)
# и заходит на страницу каждой модели. Там берёт ВСЕ цены и выгоды:
# цена модели — самая маленькая, выгода — самая большая.
# Можно использовать вместе с pages: итог по модели всё равно мин. цена и макс. выгода.
models:
  list_url: https://example-dealer.ru/models   # страница со списком моделей
  link: .model-card a                          # ссылка на страницу модели
  name: .model-card__title                     # название внутри ссылки (можно не писать)
  page:                                        # что искать на странице модели
    title: h1                                  # название модели (можно не писать)
    trim: .complectation                       # блок одной комплектации (можно не писать)
    price: .complectation__price               # цены комплектаций
    benefit: .complectation__benefit           # выгоды комплектаций
    # click / wait_for / scroll — как в pages

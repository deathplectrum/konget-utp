# Общий шаблон сверки УТП для дилерских сайтов на платформе TradeDealer (gac-autoimport.ru, volga-avtomarket.ru…).
# Адреса — от корня сайта.
engine: TradeDealer

# С главной берём ссылки на страницы моделей /models/…, на каждой — название, цены и выгоды.
# Цены и выгоды берём только из основной части страницы (<main>): в шапке сайта меню
# со всеми моделями и их ценами «от», они к этой модели не относятся.
# Выгоды — по тексту основной части: в счёт идут только фразы со словами «выгода», «скидка».
models:
  list_url: /
  link: a[href^="/models/"]
  page:
    title: h1
    trim: main
    price: '[class*="price"]'
    benefit: main

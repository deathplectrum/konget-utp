# Запасной шаблон для сайтов, у движка которых ещё нет своего шаблона.
# Ищет ссылки на страницы моделей и берёт с них цены «от …» и выгоды по всему тексту страницы.
# Точность ниже, чем у шаблона движка, поэтому такие сайты всегда помечаются «Требует проверки».
engine: '*'
check: true

models:
  list_url: /
  link: a[href*="/models/"], a[href*="/model/"]
  max_links: 30
  page:
    title: h1
    price: body
    benefit: body
